<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="aws-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F7981D"/>
      <stop offset="100%" style="stop-color:#D05C17"/>
    </linearGradient>
    <linearGradient id="aws-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4D72F3"/>
      <stop offset="100%" style="stop-color:#3334B9"/>
    </linearGradient>
    <linearGradient id="aws-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A337"/>
      <stop offset="100%" style="stop-color:#277116"/>
    </linearGradient>
    <linearGradient id="aws-pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4F8B"/>
      <stop offset="100%" style="stop-color:#BC1356"/>
    </linearGradient>
    <linearGradient id="aws-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F54749"/>
      <stop offset="100%" style="stop-color:#C7131F"/>
    </linearGradient>
    <linearGradient id="aws-teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4AB29A"/>
      <stop offset="100%" style="stop-color:#116D5B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">TaskTitan FORGE v2 - AWS Serverless Architecture</text>
  <text x="550" y="55" text-anchor="middle" font-size="12" fill="#666">us-east-2 | App Runner + DynamoDB | No VPC Required</text>

  <!-- AWS Cloud Border -->
  <rect x="70" y="75" width="960" height="570" rx="8" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="90" y="95" font-size="12" font-weight="bold" fill="#232F3E">AWS Cloud (us-east-2)</text>

  <!-- Users Icon -->
  <g transform="translate(15, 200)">
    <circle cx="25" cy="12" r="10" fill="#232F3E"/>
    <ellipse cx="25" cy="38" rx="18" ry="12" fill="#232F3E"/>
    <text x="25" y="65" text-anchor="middle" font-size="11" fill="#232F3E">Users</text>
  </g>

  <!-- ========== COMPUTE LAYER ========== -->
  <rect x="90" y="110" width="280" height="190" rx="6" fill="#fff3e0" stroke="#D05C17" stroke-width="1"/>
  <text x="110" y="130" font-size="11" font-weight="bold" fill="#D05C17">Compute (Serverless)</text>

  <!-- App Runner -->
  <g transform="translate(110, 145)" filter="url(#shadow)">
    <rect width="110" height="80" rx="5" fill="url(#aws-orange)"/>
    <text x="55" y="28" text-anchor="middle" font-size="22" fill="white">??</text>
    <text x="55" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="white">App Runner</text>
    <text x="55" y="62" text-anchor="middle" font-size="8" fill="white">Next.js 15</text>
    <text x="55" y="74" text-anchor="middle" font-size="7" fill="white">Auto-scaling</text>
  </g>

  <!-- Lambda -->
  <g transform="translate(240, 145)" filter="url(#shadow)">
    <rect width="110" height="80" rx="5" fill="url(#aws-orange)"/>
    <text x="55" y="28" text-anchor="middle" font-size="22" fill="white">?</text>
    <text x="55" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Lambda</text>
    <text x="55" y="62" text-anchor="middle" font-size="8" fill="white">Async Jobs</text>
    <text x="55" y="74" text-anchor="middle" font-size="7" fill="white">No VPC</text>
  </g>

  <!-- App Runner URL note -->
  <text x="230" y="250" text-anchor="middle" font-size="9" fill="#D05C17">*.awsapprunner.com (HTTPS built-in)</text>
  <text x="230" y="265" text-anchor="middle" font-size="8" fill="#888">Zero cold-start ? No ALB/NAT needed</text>

  <!-- ========== DATA LAYER ========== -->
  <rect x="390" y="110" width="180" height="190" rx="6" fill="#e3f2fd" stroke="#3334B9" stroke-width="1"/>
  <text x="410" y="130" font-size="11" font-weight="bold" fill="#3334B9">Data (Serverless)</text>

  <!-- DynamoDB -->
  <g transform="translate(420, 145)" filter="url(#shadow)">
    <rect width="120" height="80" rx="5" fill="url(#aws-blue)"/>
    <text x="60" y="26" text-anchor="middle" font-size="20" fill="white">??</text>
    <text x="60" y="44" text-anchor="middle" font-size="10" font-weight="bold" fill="white">DynamoDB</text>
    <text x="60" y="56" text-anchor="middle" font-size="8" fill="white">ElectroDB</text>
    <text x="60" y="68" text-anchor="middle" font-size="7" fill="white">Single-Table Design</text>
    <text x="60" y="78" text-anchor="middle" font-size="7" fill="white">On-Demand Billing</text>
  </g>

  <!-- DynamoDB note -->
  <text x="480" y="250" text-anchor="middle" font-size="9" fill="#3334B9">Public HTTPS Endpoint</text>
  <text x="480" y="265" text-anchor="middle" font-size="8" fill="#888">PITR ? Streams Enabled</text>

  <!-- ========== AI LAYER ========== -->
  <rect x="590" y="110" width="160" height="190" rx="6" fill="#e0f2f1" stroke="#116D5B" stroke-width="1"/>
  <text x="610" y="130" font-size="11" font-weight="bold" fill="#116D5B">AI / ML</text>

  <!-- Bedrock -->
  <g transform="translate(615, 145)" filter="url(#shadow)">
    <rect width="110" height="80" rx="5" fill="url(#aws-teal)"/>
    <text x="55" y="28" text-anchor="middle" font-size="20" fill="white">??</text>
    <text x="55" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Bedrock</text>
    <text x="55" y="62" text-anchor="middle" font-size="8" fill="white">Claude Sonnet</text>
    <text x="55" y="74" text-anchor="middle" font-size="7" fill="white">AI Generation</text>
  </g>

  <!-- ========== AUTH & SECURITY ========== -->
  <rect x="770" y="110" width="240" height="190" rx="6" fill="#ffebee" stroke="#C7131F" stroke-width="1"/>
  <text x="790" y="130" font-size="11" font-weight="bold" fill="#C7131F">Auth & Security</text>

  <!-- Cognito -->
  <g transform="translate(790, 145)" filter="url(#shadow)">
    <rect width="95" height="80" rx="5" fill="url(#aws-red)"/>
    <text x="48" y="28" text-anchor="middle" font-size="20" fill="white">??</text>
    <text x="48" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Cognito</text>
    <text x="48" y="62" text-anchor="middle" font-size="8" fill="white">User Pool</text>
    <text x="48" y="74" text-anchor="middle" font-size="7" fill="white">Self Sign-up</text>
  </g>

  <!-- Secrets Manager -->
  <g transform="translate(900, 145)" filter="url(#shadow)">
    <rect width="95" height="80" rx="5" fill="url(#aws-red)"/>
    <text x="48" y="28" text-anchor="middle" font-size="20" fill="white">??</text>
    <text x="48" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Secrets</text>
    <text x="48" y="62" text-anchor="middle" font-size="8" fill="white">Manager</text>
    <text x="48" y="74" text-anchor="middle" font-size="7" fill="white">Encryption Keys</text>
  </g>

  <!-- Cognito domain note -->
  <text x="890" y="250" text-anchor="middle" font-size="8" fill="#C7131F">*.amazoncognito.com</text>

  <!-- ========== INTEGRATION LAYER ========== -->
  <rect x="90" y="320" width="430" height="130" rx="6" fill="#fce4ec" stroke="#BC1356" stroke-width="1"/>
  <text x="110" y="340" font-size="11" font-weight="bold" fill="#BC1356">Real-time & Integration</text>

  <!-- AppSync -->
  <g transform="translate(110, 360)" filter="url(#shadow)">
    <rect width="90" height="60" rx="5" fill="url(#aws-pink)"/>
    <text x="45" y="22" text-anchor="middle" font-size="16" fill="white">??</text>
    <text x="45" y="40" text-anchor="middle" font-size="9" font-weight="bold" fill="white">AppSync</text>
    <text x="45" y="52" text-anchor="middle" font-size="7" fill="white">Events API</text>
  </g>

  <!-- EventBridge -->
  <g transform="translate(220, 360)" filter="url(#shadow)">
    <rect width="90" height="60" rx="5" fill="url(#aws-pink)"/>
    <text x="45" y="22" text-anchor="middle" font-size="16" fill="white">?</text>
    <text x="45" y="40" text-anchor="middle" font-size="9" font-weight="bold" fill="white">EventBridge</text>
    <text x="45" y="52" text-anchor="middle" font-size="7" fill="white">Scheduler</text>
  </g>

  <!-- SQS DLQ -->
  <g transform="translate(330, 360)" filter="url(#shadow)">
    <rect width="90" height="60" rx="5" fill="url(#aws-pink)"/>
    <text x="45" y="22" text-anchor="middle" font-size="16" fill="white">??</text>
    <text x="45" y="40" text-anchor="middle" font-size="9" font-weight="bold" fill="white">SQS</text>
    <text x="45" y="52" text-anchor="middle" font-size="7" fill="white">Dead Letter</text>
  </g>

  <!-- S3 -->
  <g transform="translate(420" y="360)" filter="url(#shadow)">
    <rect width="90" height="60" rx="5" fill="url(#aws-green)"/>
    <text x="45" y="22" text-anchor="middle" font-size="16" fill="white">??</text>
    <text x="45" y="40" text-anchor="middle" font-size="9" font-weight="bold" fill="white">S3</text>
    <text x="45" y="52" text-anchor="middle" font-size="7" fill="white">Access Logs</text>
  </g>

  <!-- ========== OBSERVABILITY ========== -->
  <rect x="540" y="320" width="280" height="130" rx="6" fill="#f3e5f5" stroke="#7B1FA2" stroke-width="1"/>
  <text x="560" y="340" font-size="11" font-weight="bold" fill="#7B1FA2">Observability</text>

  <!-- CloudWatch -->
  <g transform="translate(560, 360)" filter="url(#shadow)">
    <rect width="80" height="60" rx="5" fill="url(#aws-pink)"/>
    <text x="40" y="22" text-anchor="middle" font-size="16" fill="white">??</text>
    <text x="40" y="40" text-anchor="middle" font-size="9" font-weight="bold" fill="white">CloudWatch</text>
    <text x="40" y="52" text-anchor="middle" font-size="7" fill="white">Dashboard</text>
  </g>

  <!-- X-Ray -->
  <g transform="translate(655, 360)" filter="url(#shadow)">
    <rect width="80" height="60" rx="5" fill="url(#aws-pink)"/>
    <text x="40" y="22" text-anchor="middle" font-size="16" fill="white">??</text>
    <text x="40" y="40" text-anchor="middle" font-size="9" font-weight="bold" fill="white">X-Ray</text>
    <text x="40" y="52" text-anchor="middle" font-size="7" fill="white">Tracing</text>
  </g>

  <!-- Container Insights -->
  <g transform="translate(750, 360)" filter="url(#shadow)">
    <rect width="60" height="60" rx="5" fill="url(#aws-pink)"/>
    <text x="30" y="22" text-anchor="middle" font-size="14" fill="white">??</text>
    <text x="30" y="40" text-anchor="middle" font-size="8" font-weight="bold" fill="white">Logs</text>
  </g>

  <!-- ========== CONNECTIONS ========== -->
  <g stroke="#232F3E" stroke-width="1.5" fill="none">
    <!-- Users to App Runner -->
    <path d="M 60 235 L 110 185" marker-end="url(#arrow)"/>
    <text x="70" y="200" font-size="8" fill="#232F3E">HTTPS</text>
    
    <!-- App Runner to DynamoDB -->
    <path d="M 220 185 L 420 185" stroke="#3334B9" stroke-width="2"/>
    
    <!-- App Runner to Lambda -->
    <path d="M 220 200 L 240 200" stroke="#D05C17" stroke-dasharray="4,2"/>
    
    <!-- App Runner to Bedrock -->
    <path d="M 220 170 L 615 185" stroke="#116D5B"/>
    
    <!-- App Runner to Cognito -->
    <path d="M 220 155 L 790 175" stroke="#C7131F" stroke-dasharray="4,2"/>
    
    <!-- Lambda to DynamoDB -->
    <path d="M 350 185 L 420 185" stroke="#3334B9" stroke-dasharray="4,2"/>
    
    <!-- App Runner to AppSync -->
    <path d="M 165 225 L 155 360" stroke="#BC1356" stroke-dasharray="4,2"/>
    
    <!-- EventBridge to Lambda -->
    <path d="M 265 360 L 295 225" stroke="#BC1356" stroke-dasharray="4,2"/>
    
    <!-- AppSync to Users (WebSocket) -->
    <path d="M 110 390 L 50 280" stroke="#BC1356" stroke-dasharray="4,2"/>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#232F3E"/>
    </marker>
  </defs>

  <!-- ========== INFO BOXES ========== -->
  
  <!-- Cost Box -->
  <g transform="translate(90, 470)">
    <rect width="180" height="65" rx="6" fill="#e8f5e9" stroke="#277116" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-size="10" font-weight="bold" fill="#277116">?? Est. Monthly Cost</text>
    <text x="90" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#277116">~$30-50</text>
    <text x="90" y="55" text-anchor="middle" font-size="8" fill="#666">(70% savings vs ECS+Aurora)</text>
  </g>

  <!-- Stack Box -->
  <g transform="translate(290, 470)">
    <rect width="200" height="65" rx="6" fill="#fff3e0" stroke="#D05C17" stroke-width="1.5"/>
    <text x="100" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#D05C17">??? Tech Stack</text>
    <text x="100" y="36" text-anchor="middle" font-size="9" fill="#232F3E">Next.js 15 + ElectroDB</text>
    <text x="100" y="50" text-anchor="middle" font-size="8" fill="#666">TypeScript ? Single-Table</text>
    <text x="100" y="62" text-anchor="middle" font-size="8" fill="#666">Zero cold-start</text>
  </g>

  <!-- Architecture Highlights -->
  <g transform="translate(510, 470)">
    <rect width="240" height="65" rx="6" fill="#e3f2fd" stroke="#3334B9" stroke-width="1.5"/>
    <text x="120" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#3334B9">? Architecture Highlights</text>
    <text x="120" y="36" text-anchor="middle" font-size="9" fill="#232F3E">No VPC ? No NAT Gateway ? No ALB</text>
    <text x="120" y="50" text-anchor="middle" font-size="8" fill="#666">Fully serverless ? Pay-per-use</text>
    <text x="120" y="62" text-anchor="middle" font-size="8" fill="#666">Auto-scaling to zero</text>
  </g>

  <!-- Legend -->
  <g transform="translate(90, 555)">
    <rect width="660" height="40" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="15" y="25" font-size="10" font-weight="bold" fill="#232F3E">Legend:</text>
    
    <rect x="70" y="14" width="14" height="14" rx="2" fill="url(#aws-orange)"/>
    <text x="90" y="25" font-size="9" fill="#232F3E">Compute</text>
    
    <rect x="150" y="14" width="14" height="14" rx="2" fill="url(#aws-blue)"/>
    <text x="170" y="25" font-size="9" fill="#232F3E">Database</text>
    
    <rect x="235" y="14" width="14" height="14" rx="2" fill="url(#aws-teal)"/>
    <text x="255" y="25" font-size="9" fill="#232F3E">AI/ML</text>
    
    <rect x="300" y="14" width="14" height="14" rx="2" fill="url(#aws-red)"/>
    <text x="320" y="25" font-size="9" fill="#232F3E">Security</text>
    
    <rect x="380" y="14" width="14" height="14" rx="2" fill="url(#aws-pink)"/>
    <text x="400" y="25" font-size="9" fill="#232F3E">Integration</text>
    
    <rect x="480" y="14" width="14" height="14" rx="2" fill="url(#aws-green)"/>
    <text x="500" y="25" font-size="9" fill="#232F3E">Storage</text>
    
    <line x1="560" y1="21" x2="600" y2="21" stroke="#232F3E" stroke-width="2"/>
    <text x="608" y="25" font-size="9" fill="#232F3E">Data</text>
    
    <line x1="638" y1="21" x2="678" y2="21" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="686" y="25" font-size="9" fill="#232F3E">Async</text>
  </g>

  <!-- Footer -->
  <text x="550" y="620" text-anchor="middle" font-size="9" fill="#999">TaskTitan FORGE v2 | Fully Serverless | No VPC/Aurora/CloudFront/Route53 | github.com/annabook21/TaskTitan</text>
</svg>
