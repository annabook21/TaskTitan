# Phase 2/3: AppSync GraphQL API (main API; CloudFront + S3 frontend, no App Runner)
# Auth: Cognito User Pools. Data: DynamoDB (same table as ElectroDB) + Lambda (Bedrock).
# Region: us-east-2.

type User {
  id: ID!
  # Email is nullable to handle edge cases where user record exists but email wasn't migrated
  email: String
  name: String
  avatarUrl: String
  createdAt: String
  updatedAt: String
  # Timestamp-based "Read Until" marker for O(1) mark-all-as-read (AWS best practice)
  # Notifications with createdAt <= notificationsReadUntil are considered read
  notificationsReadUntil: String
}

type Project @aws_cognito_user_pools @aws_iam {
  id: ID!
  name: String!
  description: String
  teamId: String!
  ownerId: String!
  createdAt: String
  updatedAt: String
}

type Team {
  id: ID!
  name: String!
  description: String
  createdAt: String
  updatedAt: String
}

enum MemberRole {
  OWNER
  ADMIN
  MEMBER
  VIEWER
}

enum ComponentType {
  EPIC
  FEATURE
  STORY
  TASK
  BUG
}

enum ComponentStatus {
  PLANNING
  IN_PROGRESS
  BLOCKED
  REVIEW
  COMPLETED
}

enum SprintStatus {
  PLANNING
  ACTIVE
  COMPLETED
  CANCELLED
}

# Sprint: time-boxed iteration for a team
# pk=SPRINT#id, sk=METADATA, gsi1pk=TEAM#teamId, gsi1sk=SPRINT#id
type Sprint {
  id: ID!
  teamId: String!
  name: String!
  goal: String
  status: SprintStatus!
  startDate: String
  endDate: String
  createdAt: String
  updatedAt: String
}

type SprintWithComponents {
  sprint: Sprint!
  components: [Component!]!
}

type Component @aws_cognito_user_pools @aws_iam {
  id: ID!
  name: String!
  description: String
  type: ComponentType!
  projectId: String!
  parentId: String
  sprintId: String
  status: ComponentStatus!
  priority: Int
  estimatedHours: Float
  actualHours: Float
  dueDate: String
  owner: String
  tags: [String!]
  createdAt: String
  updatedAt: String
  # Kanban: Timestamp when work started (for cycle time calculation)
  # Cycle Time = completedAt - startedAt (Little's Law)
  startedAt: String
  # Shape Up: Manual hill chart position (0-100)
  # 0-50 = "figuring things out" (uphill), 51-100 = "making it happen" (downhill)
  hillPhase: Int
}

type Membership {
  id: ID!
  userId: String!
  teamId: String!
  role: MemberRole!
  joinedAt: String
  title: String
  hoursPerDay: Int
  availability: Int
  user: User
}

# Dependency represents a "depends on" relationship between components
# pk=COMPONENT#fromId, sk=DEPENDS_ON#toId, gsi1pk=REQUIRED_BY#toId, gsi1sk=COMPONENT#fromId
type Dependency {
  fromComponentId: ID!
  toComponentId: ID!
  createdAt: String
}

# Assignment represents a user assigned to a component
# pk=COMPONENT#componentId, sk=ASSIGNEE#userId, gsi1pk=USER#userId, gsi1sk=ASSIGNMENT#componentId
type Assignment @aws_cognito_user_pools @aws_iam {
  id: ID!
  componentId: ID!
  userId: ID!
  assignedAt: String!
  user: User
  component: Component
}

# For MyTasksPage - returns assignments with full component details
type AssignmentWithComponent @aws_cognito_user_pools @aws_iam {
  assignment: Assignment!
  component: Component!
}

type TeamWithMembers {
  team: Team!
  members: [Membership!]!
}

# Activity types for project activity feed
enum ActivityType {
  PROJECT_CREATED
  COMPONENT_CREATED
  COMPONENT_UPDATED
  COMPONENT_STATUS_CHANGED
  DEPENDENCY_ADDED
  DEPENDENCY_REMOVED
  MEMBER_ASSIGNED
  MEMBER_UNASSIGNED
  COMMENT_ADDED
  SPRINT_CREATED
  SPRINT_STARTED
  SPRINT_COMPLETED
  COMPONENT_ADDED_TO_SPRINT
  COMPONENT_REMOVED_FROM_SPRINT
  GITHUB_PR_OPENED
  GITHUB_PR_MERGED
  GITHUB_PR_CLOSED
  GITHUB_PR_LINKED
}

# Activity: project event log entry
# pk=PROJECT#projectId, sk=ACTIVITY#createdAt#id
type Activity {
  id: ID!
  type: ActivityType!
  projectId: String!
  userId: String!
  metadata: String
  createdAt: String!
}

# Notification types for user notifications
enum NotificationType {
  TASK_ASSIGNED
  TASK_STATUS_CHANGED
  TASK_COMMENT
  TASK_DUE_SOON
  TASK_OVERDUE
  SPRINT_STARTED
  SPRINT_ENDING
}

# Notification: user notification
# pk=USER#userId, sk=NOTIFICATION#createdAt#id
type Notification {
  id: ID!
  userId: String!
  type: NotificationType!
  title: String!
  message: String!
  componentId: String
  projectId: String
  read: Boolean!
  createdAt: String!
}

